services:
  target-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: store
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d store"]
      interval: 3s
      timeout: 3s
      retries: 5

  target-api:
    build: ./target_app
    environment:
      DATABASE_URL: postgresql://app:app@target-db:5432/store
    ports:
      - "8001:8000"
    volumes:
      - ./logs:/logs
    depends_on:
      target-db:
        condition: service_healthy